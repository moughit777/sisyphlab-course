<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 220 60">
  <!-- Icon: lime green square background -->
  <rect x="2" y="2" width="56" height="56" rx="12" ry="12" fill="#CCFF00"/>

  <!-- Main diagonal slash (large parallelogram) -->
  <polygon points="14,8 26,8 44,52 32,52" fill="#0a0a0a"/>

  <!-- Small rounded square bottom-right -->
  <rect x="36" y="36" width="17" height="17" rx="4" ry="4" fill="#0a0a0a"/>

  <!-- Wordmark: Sisyph -->
  <text x="72" y="29" font-family="Arial Black, Arial, sans-serif" font-size="19" font-weight="900" fill="#F8F8F8" letter-spacing="-0.5">Sisyph</text>
  <!-- Wordmark: LAB -->
  <text x="73" y="48" font-family="Arial, Helvetica, sans-serif" font-size="13" font-weight="600" fill="#CCFF00" letter-spacing="3.5">LAB</text>
</svg>
